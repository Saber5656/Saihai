{
  "workflow_template_version": "1",
  "workflow_id": "readonly_review_chain",
  "lifecycle_status": "active",
  "purpose": "Read-only research followed by independent review and deterministic final evidence validation. Declares contracts for later multi-step executors; does not commission them.",
  "safety_class": "readonly",
  "publication_gate": {
    "supported": false,
    "required_by_default": false
  },
  "gates": {
    "entry": [
      "entry.activation_approved",
      "entry.work_order_valid"
    ],
    "exit": [
      "exit.typed_report_valid",
      "exit.research_evidence_complete",
      "exit.final_evidence_complete"
    ]
  },
  "mandatory_gates": [
    "entry.activation_approved",
    "entry.work_order_valid",
    "exit.typed_report_valid",
    "exit.research_evidence_complete",
    "exit.final_evidence_complete"
  ],
  "initial_step": "research",
  "max_steps": 3,
  "scheduler": {
    "mode": "invocation-drain",
    "state_persistence": "durable_state",
    "lock_policy": "global_advisory_lock",
    "concurrency": 1
  },
  "result_authority": {
    "canonical": [
      "typed_report_file",
      "normalized_provider_evidence_file"
    ],
    "signals_only": [
      "stdout",
      "provider_transcript"
    ]
  },
  "context_sharing": {
    "shared_run_state": "typed_durable_state",
    "step_local_snapshot": "immutable_step_attempt_snapshot",
    "provider_transcript": "confined_evidence_path_only"
  },
  "provider_adapter": {
    "capability_schema": "organization/runtime/workflows/schemas/provider-adapter-capability.schema.json",
    "allowed_transports": [
      "headless_cli",
      "codex_exec"
    ],
    "default_transport": "headless_cli"
  },
  "output_contracts": {
    "research_report": {
      "schema_path": "organization/runtime/workflows/schemas/research-report.schema.json",
      "required": true,
      "canonical": true
    },
    "external_review_report": {
      "schema_path": "organization/runtime/workflows/schemas/external-review-report.schema.json",
      "required": true,
      "canonical": true
    },
    "final_evidence": {
      "schema_path": "organization/runtime/workflows/schemas/readonly-final-evidence-report.schema.json",
      "required": true,
      "canonical": true
    }
  },
  "steps": [
    {
      "id": "research",
      "role": "contents-researcher",
      "assignment_role": "observer",
      "permission_mode": "readonly",
      "provider_route": {
        "adapter_kind": "bounded_provider",
        "runner_authority": "write_report_only",
        "transition_authority": "harness_engine"
      },
      "input_contract": "work_order",
      "output_contract": "research_report",
      "context_scope": {
        "allowed_modes": [
          "refs_only",
          "selected_snapshot",
          "diff_summary"
        ],
        "raw_transcript_sharing": "forbidden",
        "promotion_rule": "typed_report_refs_only"
      },
      "quality_gates": [
        {
          "gate": "source_refs_gate",
          "requires": "source_refs"
        },
        {
          "gate": "uncertainty_gate",
          "requires": "uncertainty"
        },
        {
          "gate": "no_diff_gate",
          "requires": "no_diff_completion"
        }
      ],
      "transitions": [
        {
          "on": "research_complete",
          "to": "review"
        },
        {
          "on": "report_invalid",
          "to": "blocked",
          "reason_class": "invalid_report"
        }
      ],
      "allowed_ops": {
        "edit": false,
        "commit": false,
        "push": false,
        "network": false
      }
    },
    {
      "id": "review",
      "role": "tech-reviewer",
      "assignment_role": "reviewer",
      "permission_mode": "readonly",
      "provider_route": {
        "adapter_kind": "bounded_provider",
        "runner_authority": "write_report_only",
        "transition_authority": "harness_engine"
      },
      "input_contract": "work_order",
      "output_contract": "external_review_report",
      "context_scope": {
        "allowed_modes": [
          "refs_only",
          "selected_snapshot",
          "diff_summary"
        ],
        "raw_transcript_sharing": "forbidden",
        "promotion_rule": "typed_report_refs_only"
      },
      "quality_gates": [
        {
          "gate": "schema_gate",
          "requires": "external_review_report"
        },
        {
          "gate": "provider_evidence_gate",
          "requires": [
            "provider_session_id",
            "request_id",
            "intended_model",
            "effective_model",
            "transcript_path",
            "evidence_path"
          ]
        },
        {
          "gate": "context_scope_gate",
          "forbids": [
            "secrets",
            "unbounded_repo_dump",
            "unbounded_vault_dump",
            "raw_transcript_broadcast"
          ]
        }
      ],
      "transitions": [
        {
          "on": "review_complete",
          "to": "final_evidence"
        },
        {
          "on": "review_blocked",
          "to": "blocked",
          "reason_class": "review_not_passed"
        }
      ],
      "allowed_ops": {
        "edit": false,
        "commit": false,
        "push": false,
        "network": false
      }
    },
    {
      "id": "final_evidence",
      "role": "gate-task-evaluator",
      "assignment_role": "reviewer",
      "permission_mode": "readonly",
      "provider_route": {
        "adapter_kind": "harness_gate",
        "runner_authority": "validate_evidence_only",
        "transition_authority": "harness_engine"
      },
      "input_contract": "work_order",
      "output_contract": "final_evidence",
      "quality_gates": [
        {
          "gate": "final_evidence_gate",
          "requires": "evidence_refs"
        }
      ],
      "transitions": [
        {
          "on": "final_evidence_valid",
          "to": "complete"
        },
        {
          "on": "final_evidence_invalid",
          "to": "blocked",
          "reason_class": "missing_final_evidence"
        }
      ],
      "allowed_ops": {
        "edit": false,
        "commit": false,
        "push": false,
        "network": false
      }
    }
  ],
  "terminal_states": [
    "complete",
    "blocked",
    "waiting_human",
    "aborted"
  ]
}
