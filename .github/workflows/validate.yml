name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install locked validation dependency in isolation
        run: |
          python3 -m venv "$RUNNER_TEMP/delivery-venv"
          "$RUNNER_TEMP/delivery-venv/bin/python3" -m pip install --require-hashes --only-binary=:all: --no-deps -r .github/requirements-delivery.lock
      - name: Run validation suite
        env:
          SAIHAI_ROOT: ${{ github.workspace }}
          AGENTS_VAULT_ROOT: ${{ runner.temp }}/agents-vault
          USER_VAULT_ROOT: ${{ runner.temp }}/user-vault
          SKILLS_REPO_ROOT: ${{ github.workspace }}
          SKILLS_ROOT: ${{ github.workspace }}/organization/roles
          DOTFILES_ROOT: ${{ github.workspace }}
          DEV_ROOT: ${{ runner.temp }}
          DEV_WORKTREES_ROOT: ${{ runner.temp }}/worktrees
          TASK_WORKTREE_ROOT: ${{ runner.temp }}/worktrees
        run: |
          mkdir -p "$AGENTS_VAULT_ROOT" "$USER_VAULT_ROOT" "$DEV_WORKTREES_ROOT"
          "$RUNNER_TEMP/delivery-venv/bin/python3" scripts/validate_all.py
